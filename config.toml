# Local dev defaults. Edit all of these before deploying publicly —
# see the [webauthn] note below in particular.

[server]
ip = "0.0.0.0"
port = 7777
site_root = "target/site"
# The session cookie normally gets the Secure flag automatically whenever
# webauthn.rp_origin below is "https://...". Uncomment to force it off — only
# do this if this exact deployment is NOT also reached over HTTPS by real
# users (e.g. this config.toml is serving a LAN-only/testing instance).
# Forcing it off on a config that's also public over HTTPS would let the
# session cookie be sent unencrypted if that traffic were ever downgraded to
# plain HTTP.
cookie_secure = false

[database]
path = "app.db"
uploads_dir = "uploads"

[webauthn]
# Passkeys require rp_id to be the exact effective domain the browser sees.
# In production this must be your real domain, served over https, e.g.:
#   rp_id = "notes.example.com"
#   rp_origin = "https://notes.example.com"
# Locally, browse via http://localhost:3000 (not 127.0.0.1) for these
# defaults to work.
rp_id = "localhost"
rp_origin = "http://localhost:7777"
