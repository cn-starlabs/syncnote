<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background / Document Gradient -->
    <linearGradient id="docGrad" x1="12" y1="6" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Fold / Accent Gradient -->
    <linearGradient id="foldGrad" x1="35" y1="5" x2="47" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Sync Circle Gradient -->
    <linearGradient id="syncGrad" x1="30" y1="30" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Drop Shadow Filter for badge -->
    <filter id="badgeShadow" x="25" y="25" width="36" height="36" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#090d16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Note Document Base -->
  <path d="M14 8C14 6.34315 15.3431 5 17 5H35L47 17V49C47 50.6569 45.6569 52 44 52H17C15.3431 52 14 50.6569 14 49V8Z"
        fill="url(#docGrad)"/>

  <!-- Folded Corner -->
  <path d="M35 5L47 17H38C36.3431 17 35 15.6569 35 14V5Z"
        fill="url(#foldGrad)"/>

  <!-- Note Content Lines -->
  <line x1="21" y1="21" x2="29" y2="21" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="21" y1="28" x2="31" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="21" y1="35" x2="28" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="21" y1="42" x2="26" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Sync Floating Badge with Shadow -->
  <g filter="url(#badgeShadow)">
    <circle cx="43" cy="43" r="14" fill="#0F172A"/>
    <circle cx="43" cy="43" r="13" fill="url(#syncGrad)"/>

    <!-- Top Sync Arrow -->
    <path d="M43 35.5C46.8 35.5 49.8 38.2 50.4 41.8"
          stroke="white" stroke-width="2" stroke-linecap="round"/>
    <polygon points="50.4,41.8 47.4,38.5 53.4,38.5" fill="white"/>

    <!-- Bottom Sync Arrow -->
    <path d="M43 50.5C39.2 50.5 36.2 47.8 35.6 44.2"
          stroke="white" stroke-width="2" stroke-linecap="round"/>
    <polygon points="35.6,44.2 38.6,47.5 32.6,47.5" fill="white"/>
  </g>
</svg>
